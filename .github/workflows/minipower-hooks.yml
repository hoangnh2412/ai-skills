name: minipower-hooks

# Chạy golden test cho hook logic (SSOT dùng chung Cursor/Claude/OpenCode).
# Matrix 3 OS: chính là lưới bắt lại class bug cross-platform mà bản .ps1/.sh/.ts
# từng lệch nhau (regex có dấu/không dấu, path / vs \). Xem ADRs/.

on:
  push:
    paths:
      - "sdlc/hooks/**"
      - "sdlc/agents/auto-routing.md"
      - ".github/workflows/minipower-hooks.yml"
      - "**/*.md"
  pull_request:
    paths:
      - "sdlc/hooks/**"
      - "sdlc/agents/auto-routing.md"
      - ".github/workflows/minipower-hooks.yml"
      - "**/*.md"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdlc/hooks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests (node --test)
        run: node --test

  # Link markdown tương đối phải trỏ file có thật (ADR-022 §6 bước 1).
  # Chỉ FAIL khi có link gãy MỚI ngoài hooks/link-check.baseline.txt.
  link-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdlc/hooks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check markdown links (npm run link:check)
        run: npm run link:check
